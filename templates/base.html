<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ethylene Simulation Inside Avocado Package</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg', v='20260908') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='20260908') }}" />
  <script defer src="{{ url_for('static', filename='js/script.js', v='20260908') }}"></script>
</head>
<body>
  <div class="page-bg" aria-hidden="true">
    <div class="page-glow glow-left"></div>
    <div class="page-glow glow-right"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <button type="button" class="brand-home" aria-label="Reload home">
        <img src="{{ url_for('static', filename='img/avocado.svg') }}" alt="Logo" class="logo" />
        <div class="title-block">
          <h1>Ethylene Simulation</h1>
          <span class="sub">Inside Avocado Package</span>
        </div>
      </button>

      <div class="topbar-meta">
        <span class="meta-pill">Version 1.1</span>
        <span class="meta-pill meta-pill-accent">&copy; 2025 All rights reserved</span>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <div class="footer-card">
        <p class="cite">
          <a href="https://doi.org/10.1016/j.postharvbio.2023.112734" target="_blank" rel="noopener">
            Sonawane et al. (2024). A model integrating fruit physiology, perforation, and scavenger for prediction of ethylene accumulation in fruit packages. Postharvest Biology and Technology, 209, 112734.
          </a>
        </p>
      </div>
    </footer>
  </div>
</body>
</html>
